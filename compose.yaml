services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-business_card}
      POSTGRES_USER: ${POSTGRES_USER:-business_card}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - business_card

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-business_card}:${POSTGRES_PASSWORD:-local-development-only-password}@db:5432/${POSTGRES_DB:-business_card}?schema=public
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - business_card

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GRAPHQL_URL: /graphql
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - business_card

volumes:
  postgres_data:

networks:
  business_card:
    driver: bridge
